# log_analyzer_with_download.yml
- hosts: IS
  become: yes
  vars:
    # 路径配置
    analyzer_dir: "/home/sino/access_log_analyzer_release"
    analyzer_bin: "access_log_analyzer_linux_amd64"

    # 日志和输出配置
    log_dir: "/home/sino/fangwenrzhi"
    output_file: "result.csv"

    # 分析参数
    fields: "dip,domain"
    start_time: "20260506200000"
    end_time: "20260506210000"

    # 监控配置
    pid_file: "/tmp/access_analyzer_{{ ansible_date_time.date }}.pid"
    max_wait_time: 30

    # CSV文件匹配模式
    csv_pattern: "result*.csv"

    # 等待配置（可调整）
    wait_retries: 120  # 最大重试次数
    wait_delay: 10      # 每次间隔秒数

  pre_tasks:
    - name: 生成固定时间戳
      set_fact:
        execution_timestamp: "{{ ansible_date_time.year }}{{ ansible_date_time.month }}{{ ansible_date_time.day }}{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}{{ ansible_date_time.second }}"
        epoch_timestamp: "{{ ansible_date_time.epoch }}"
      run_once: yes

    - name: 设置本地基础目录
      set_fact:
        local_base: "/home/sino/access_log_analyzer_release/analyzer_{{ execution_timestamp }}"
        run_log: "analyzer_log_{{ execution_timestamp }}"
        analyzer_result_dir: "/home/sino/access_log_analyzer_release/analyzer_result_{{ execution_timestamp }}"
      run_once: yes

    - name: 检查环境
      debug:
        msg: |
          启动访问日志分析器配置：
          主机: {{ inventory_hostname }}
          分析器: {{ analyzer_dir }}/{{ analyzer_bin }}
          日志目录: {{ log_dir }}
          时间范围: {{ start_time }} 到 {{ end_time }}
          输出字段: {{ fields }}
          输出文件: {{ output_file }}
          本地下载目录: {{ local_base }}
          执行时间戳: {{ execution_timestamp }}
          最大等待时间: {{ wait_retries * wait_delay }}秒
      run_once: yes

  tasks:
    # ==================== 启动分析器 ====================
    - name: 检查分析器二进制文件
      stat:
        path: "{{ analyzer_dir }}/{{ analyzer_bin }}"
      register: binary_check
      failed_when: not binary_check.stat.exists
      ignore_errors: no

    - name: 检查是否已在运行
      shell: |
        # 使用更精确的匹配，排除grep自身
        PID_COUNT=$(ps aux | grep "{{ analyzer_bin }}" | grep "-start {{ start_time }}" | grep "-end {{ end_time }}" | grep -v grep | wc -l)
        if [ "$PID_COUNT" -gt 0 ]; then
          echo "RUNNING"
        else
          echo "NOT_RUNNING"
        fi
      register: existing_process
      when: binary_check.stat.exists
      changed_when: false
      ignore_errors: yes

    - name: 创建启动脚本
      copy:
        content: |
          #!/bin/bash

          # 切换到工作目录
          cd {{ analyzer_dir }}

          # 如果已在运行，则跳过
          if pgrep -f "{{ analyzer_bin }}.*-start {{ start_time }}.*-end {{ end_time }}" > /dev/null 2>&1; then
            echo "分析器已在运行，跳过启动"
            exit 0
          fi

          # 清理旧的日志文件
          if [ -f "{{ analyzer_dir }}/{{ run_log }}" ]; then
            echo "备份旧日志: {{ analyzer_dir }}/{{ run_log }}"
            mv "{{ analyzer_dir }}/{{ run_log }}" "{{ analyzer_dir }}/{{ run_log }}.bak_$(date +%Y%m%d%H%M%S)"
          fi

          # 清理旧版CSV文件
          echo "清理旧版CSV文件..."
          rm -f {{ analyzer_dir }}/{{ csv_pattern }}
          echo "旧版CSV文件清理完成"

          # 启动分析器
          nohup ./{{ analyzer_bin }} \
            -log_path {{ log_dir }} \
            -fields "{{ fields }}" \
            -start {{ start_time }} \
            -end {{ end_time }} \
            -output {{ output_file }} \
            > ./{{ run_log }} 2>&1 &

          # 获取进程ID
          ANALYZER_PID=$!
          echo "分析器启动成功，PID: $ANALYZER_PID"
          echo $ANALYZER_PID > {{ pid_file }}

          # 记录启动信息
          echo "启动时间: $(date)" >> {{ pid_file }}
          echo "启动命令: ./{{ analyzer_bin }} -log_path {{ log_dir }} -fields \"{{ fields }}\" -start {{ start_time }} -end {{ end_time }} -output {{ output_file }}" >> {{ pid_file }}
        dest: "/tmp/start_access_analyzer_{{ ansible_date_time.date }}.sh"
        mode: '0755'
      when:
        - binary_check.stat.exists
        - existing_process.stdout == "NOT_RUNNING"

    - name: 执行启动脚本
      shell: |
        /tmp/start_access_analyzer_{{ ansible_date_time.date }}.sh
      register: start_result
      args:
        executable: /bin/bash
      when:
        - binary_check.stat.exists
        - existing_process.stdout == "NOT_RUNNING"
      ignore_errors: yes

    - name: 检查输出日志
      shell: |
        tail -n 10 {{ analyzer_dir }}/{{ run_log }} 2>/dev/null || echo "日志文件不存在"
      register: analyzer_log
      when: binary_check.stat.exists
      changed_when: false

    # ==================== 等待执行完成 ====================
    - name: 等待分析器执行完成（异步轮询）
      shell: |
        echo "=== 检查时间: $(date '+%Y-%m-%d %H:%M:%S') ==="

        if [ -f "{{ pid_file }}" ]; then
          PID=$(head -1 {{ pid_file }})
          echo "PID文件存在: $PID"

          if kill -0 $PID 2>/dev/null; then
            echo "状态: RUNNING (进程 $PID 仍在运行)"
            exit 1
          else
            echo "状态: COMPLETED (进程 $PID 已结束)"
            exit 0
          fi
        else
          echo "PID文件不存在: {{ pid_file }}"

          if pgrep -f "{{ analyzer_bin }}.*-start {{ start_time }}.*-end {{ end_time }}" > /dev/null 2>&1; then
            FOUND_PID=$(pgrep -f "{{ analyzer_bin }}.*-start {{ start_time }}.*-end {{ end_time }}" | head -1)
            echo "状态: RUNNING (通过进程名找到 PID: $FOUND_PID)"
            exit 1
          else
            echo "状态: COMPLETED (未找到相关进程)"
            exit 0
          fi
        fi
      register: check_result
      when: binary_check.stat.exists
      changed_when: false
      ignore_errors: yes
      until: check_result.rc == 0
      retries: "{{ wait_retries }}"
      delay: "{{ wait_delay }}"

    - name: 显示每个主机的等待结果
      debug:
        msg: |
          主机: {{ inventory_hostname }}
          执行状态: {{ check_result.stdout_lines[-1] if check_result.stdout_lines is defined else 'N/A' }}
          重试次数: {{ check_result.attempts | default(0) }}
          最终返回码: {{ check_result.rc | default('N/A') }}
      when: binary_check.stat.exists

    # ==================== 验证导出文件 ====================
    - name: 验证导出文件
      shell: |
        cd {{ analyzer_dir }}
        ls -1 {{ csv_pattern }} 2>/dev/null || echo "NO_FILES"
      register: export_files
      when: binary_check.stat.exists
      changed_when: false

    - name: 检查导出文件
      fail:
        msg: "未找到导出文件，请检查日志: {{ analyzer_dir }}/{{ run_log }}"
      when:
        - binary_check.stat.exists
        - export_files.stdout == "NO_FILES"

    - name: 显示找到的导出文件
      debug:
        msg: "找到以下导出文件：\n{{ export_files.stdout }}"
      when: binary_check.stat.exists

    # ==================== 下载文件 ====================
    - name: 删除已存在的本地目录
      file:
        path: "{{ local_base }}/{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost
      become: no
      when: binary_check.stat.exists

    - name: 创建本地目录
      file:
        path: "{{ local_base }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: no
      when: binary_check.stat.exists

    - name: 打包导出文件
      shell: |
        cd {{ analyzer_dir }}
        tar -czf /tmp/csv_{{ inventory_hostname }}_{{ epoch_timestamp }}.tar.gz {{ csv_pattern }}
      when: binary_check.stat.exists
      register: archive_result
      args:
        executable: /bin/bash

    - name: 下载压缩包
      fetch:
        src: "/tmp/csv_{{ inventory_hostname }}_{{ epoch_timestamp }}.tar.gz"
        dest: "{{ local_base }}/{{ inventory_hostname }}.tar.gz"
        flat: yes
      when: binary_check.stat.exists
      register: download_result

    - name: 本地解压
      unarchive:
        src: "{{ local_base }}/{{ inventory_hostname }}.tar.gz"
        dest: "{{ local_base }}/{{ inventory_hostname }}/"
        remote_src: no
        creates: "{{ local_base }}/{{ inventory_hostname }}/{{ csv_pattern }}"
      delegate_to: localhost
      when:
        - binary_check.stat.exists
        - download_result.changed

    # ==================== 统计CSV文件 ====================
    - name: 统计每个CSV文件的日志行数
      shell: |
        cd {{ local_base }}/{{ inventory_hostname }}
        for file in *.csv; do
          if [ -f "$file" ]; then
            # 使用tail -n +2跳过首行，wc -l统计行数
            LINES=$(tail -n +2 "$file" | wc -l)
            echo "$file: $LINES"
          fi
        done
      delegate_to: localhost
      register: csv_line_counts
      changed_when: false
      when: binary_check.stat.exists

    - name: 计算总日志数
      shell: |
        cd {{ local_base }}/{{ inventory_hostname }}
        TOTAL=0
        for file in *.csv; do
          if [ -f "$file" ]; then
            LINES=$(tail -n +2 "$file" | wc -l)
            TOTAL=$((TOTAL + LINES))
          fi
        done
        echo $TOTAL
      delegate_to: localhost
      register: total_log_count
      changed_when: false
      when: binary_check.stat.exists

    # ==================== 清理临时文件 ====================
    - name: 清理远程临时文件
      file:
        path: "/tmp/csv_{{ inventory_hostname }}_*.tar.gz"
        state: absent
      when: binary_check.stat.exists

    - name: 清理本地压缩包
      file:
        path: "{{ local_base }}/{{ inventory_hostname }}.tar.gz"
        state: absent
      delegate_to: localhost
      when: binary_check.stat.exists

    - name: 清理临时脚本
      file:
        path: "/tmp/start_access_analyzer_{{ ansible_date_time.date }}.sh"
        state: absent
      when: binary_check.stat.exists

    # ==================== 执行Merge命令 ====================
    - name: 计算时间差（秒）
      shell: |
        # 解析开始时间和结束时间
        START_YEAR={{ start_time[0:4] }}
        START_MONTH={{ start_time[4:6] }}
        START_DAY={{ start_time[6:8] }}
        START_HOUR={{ start_time[8:10] }}
        START_MIN={{ start_time[10:12] }}
        START_SEC={{ start_time[12:14] }}
        
        END_YEAR={{ end_time[0:4] }}
        END_MONTH={{ end_time[4:6] }}
        END_DAY={{ end_time[6:8] }}
        END_HOUR={{ end_time[8:10] }}
        END_MIN={{ end_time[10:12] }}
        END_SEC={{ end_time[12:14] }}
        
        # 转换为时间戳并计算差值
        START_TS=$(date -d "${START_YEAR}-${START_MONTH}-${START_DAY} ${START_HOUR}:${START_MIN}:${START_SEC}" +%s)
        END_TS=$(date -d "${END_YEAR}-${END_MONTH}-${END_DAY} ${END_HOUR}:${END_MIN}:${END_SEC}" +%s)
        DURATION=$((END_TS - START_TS))
        
        echo $DURATION
      delegate_to: localhost
      register: duration_result
      changed_when: false
      when: binary_check.stat.exists

    - name: 执行Merge命令1
      shell: |
        cd {{ analyzer_dir }}
        ./{{ analyzer_bin }} -merge {{ local_base }} -fields {{ fields }} -top 10 -duration {{ duration_result.stdout }} -output {{ analyzer_result_dir }}/merged_{{ fields }}
      delegate_to: localhost
      become: no
      register: merge_result_1
      when: binary_check.stat.exists
      ignore_errors: yes

    - name: 执行Merge命令2
      shell: |
        cd {{ analyzer_dir }}
        ./{{ analyzer_bin }} -merge {{ local_base }} -fields "domain" -top 10 -duration {{ duration_result.stdout }} -output {{ analyzer_result_dir }}/merged_domain
      delegate_to: localhost
      become: no
      register: merge_result_2
      when: binary_check.stat.exists
      ignore_errors: yes

    - name: 执行Merge命令3
      shell: |
        cd {{ analyzer_dir }}
        ./{{ analyzer_bin }} -merge {{ local_base }} -fields {{ fields }} -top 10 -duration {{ duration_result.stdout }} -output {{ analyzer_result_dir }}/merged_{{ fields }} -redistribute_empty
      delegate_to: localhost
      become: no
      register: merge_result_3
      when: binary_check.stat.exists
      ignore_errors: yes

    - name: 执行Merge命令4
      shell: |
        cd {{ analyzer_dir }}
        ./{{ analyzer_bin }} -merge {{ local_base }} -fields "domain" -top 10 -duration {{ duration_result.stdout }} -output {{ analyzer_result_dir }}/merged_domain -redistribute_empty
      delegate_to: localhost
      become: no
      register: merge_result_4
      when: binary_check.stat.exists
      ignore_errors: yes

    - name: 显示Merge结果
      debug:
        msg: |
          【Merge执行结果】
          返回码: {{ merge_result.rc | default('N/A') }}
          {% if merge_result.stdout is defined and merge_result.stdout != '' %}
          输出:
          {{ merge_result.stdout }}
          {% endif %}
          {% if merge_result.stderr is defined and merge_result.stderr != '' %}
          错误:
          {{ merge_result.stderr }}
          {% endif %}
      when:
        - binary_check.stat.exists
        - merge_result is defined

    # ==================== 打包local_base目录 ====================
    - name: 打包本地下载目录
      archive:
        path: "{{ local_base }}"
        dest: "{{ local_base }}_{{ epoch_timestamp }}.tar.gz"
        format: gz
      delegate_to: localhost
      become: no
      when: binary_check.stat.exists
      register: final_archive_result

    - name: 显示打包结果
      debug:
        msg: "已打包至: {{ final_archive_result.dest }}"
      when: binary_check.stat.exists
    
    - name: 打包分析结果
      archive:
        path: "{{ analyzer_result_dir }}"
        dest: "{{ analyzer_result_dir }}_{{ epoch_timestamp }}.tar.gz"
        format: gz
      delegate_to: localhost
      become: no
      when: binary_check.stat.exists
      register: analyzer_archive_result

    - name: 显示打包结果
      debug:
        msg: "已打包至: {{ analyzer_archive_result.dest }}"
      when: binary_check.stat.exists
      
    # ==================== 验证结果 ====================
    - name: 统计文件数量
      shell: "find {{ local_base }}/{{ inventory_hostname }} -name '*.csv' -type f | wc -l"
      delegate_to: localhost
      register: file_count
      changed_when: false
      when: binary_check.stat.exists

  post_tasks:
  
    - name: 显示导出统计
      debug:
        msg: |
          【导出统计】
            导出文件数: {{ file_count.stdout | default('N/A') }}
            总日志数:   {{ total_log_count.stdout | default('N/A') }}
      when: binary_check.stat.exists

 
